<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300">
  <!-- 인덱스랩 — 열린 C 안의 캡슐, 틈에 찍힌 인덱스 점. 깔끔하고 속을 알 수 없는 -->
  <defs><clipPath id="cap"><rect x="-50" y="-21" width="100" height="42" rx="21"/></clipPath></defs>
  <circle cx="150" cy="150" r="102" fill="none" stroke="#0f4c5c" stroke-width="34" stroke-dasharray="538 90" stroke-dashoffset="583"/>
  <g transform="translate(150 150) rotate(-35)">
    <rect x="-50" y="-21" width="100" height="42" rx="21" fill="#fff"/>
    <rect x="-50" y="-21" width="50" height="42" fill="#0f4c5c" clip-path="url(#cap)"/>
    <rect x="-50" y="-21" width="100" height="42" rx="21" fill="none" stroke="#0f4c5c" stroke-width="6"/>
  </g>
  <circle cx="252" cy="150" r="13" fill="#2bb3c0"/>
  <text x="320" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="2" fill="#0f4c5c">C-INDEX</text>
  <text x="324" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="300" letter-spacing="20" fill="#0f4c5c">LAB</text>
  <rect x="478" y="200" width="290" height="2" fill="#2bb3c0"/>
  <text x="478" y="226" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="4" fill="#0f4c5c" opacity=".6">PHARMACEUTICAL RESEARCH</text>
</svg>
